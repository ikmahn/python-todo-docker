<!DOCTYPE html>
<html>
<head>
    <title>Python To-Do App</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h1 { color: #333; font-size: 1.5rem; }
        input { padding: 8px; width: 70%; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; margin-top: 20px; }
        li { background: #eee; margin-bottom: 5px; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
        a { color: #dc3545; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="New task..." required>
            <button type="submit">Add</button>
        </form>
        <ul>
            {% for task in tasks %}
                <li>
                    {{ task.content }} 
                    <a href="/delete/{{ task.id }}">Delete</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
