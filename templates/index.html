<!DOCTYPE html>
<html>
<head>
    <title>Python To-Do App</title>
</head>
<body>
    <h1>My To-Do List</h1>
    <form action="/add" method="POST">
        <input type="text" name="task" placeholder="Enter a new task" required>
        <button type="submit">Add Task</button>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                {{ task.content }} 
                <a href="/delete/{{ task.id }}">[Delete]</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
